<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#111130"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00cc6a"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#00ff88" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Upward pump chart line -->
  <path d="M10 48 L18 42 L26 44 L32 34 L38 30 L44 20 L50 14" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glow fill under line -->
  <path d="M10 48 L18 42 L26 44 L32 34 L38 30 L44 20 L50 14 L50 52 L10 52 Z" fill="url(#glow)"/>
  <!-- Pulse dot at peak -->
  <circle cx="50" cy="14" r="4" fill="#00ff88" opacity="0.9"/>
  <circle cx="50" cy="14" r="7" fill="none" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
